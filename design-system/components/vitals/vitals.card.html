<!-- @dsCard group="Components" viewport="700x340" name="Vitals — readout + never-stale reconnecting" subtitle="Severity-coded vital cards; the stale state can never be mistaken for live" -->
<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;background:var(--bg-canvas);color:var(--text);font-family:var(--font-ui);}
  .wrap{padding:var(--sp-6);display:flex;flex-direction:column;gap:var(--sp-4);}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-4);}
  .lbl{font-size:var(--fs-xs);font-weight:var(--fw-semibold);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-faint);}
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { VitalCard } = window.DesignSystem_ad98cb;
function Demo(){
  // live ticking HR to show the value-change flash (no relayout)
  const [hr,setHr] = React.useState(148);
  React.useEffect(()=>{ const id=setInterval(()=>setHr(v=>v + (Math.random()>0.5?2:-1)),1400); return ()=>clearInterval(id); },[]);
  return (
    <>
      <span className="lbl">Live vitals — severity coded (color + shape + label), tabular figures</span>
      <div className="grid">
        <VitalCard name="דופק" abbr="HR" value={hr} unit="bpm" level="elevated" trend="up" size="station" />
        <VitalCard name="ריווי חמצן" abbr="SpO₂" value={94} unit="%" level="watch" trend="down" size="station" />
        <VitalCard name="חום" abbr="TEMP" value={"38.4"} unit="°C" level="normal" trend="flat" size="station" />
      </div>
      <span className="lbl">Reconnecting — frozen, desaturated, hatched, last-seen stamp (never reads as live)</span>
      <div className="grid">
        <VitalCard name="דופק" abbr="HR" value={168} unit="bpm" level="critical" stale lastSeen="12:04:38" size="station" />
        <VitalCard name="לחץ דם" abbr="ABP" value="—" unit="mmHg" stale lastSeen="12:04:31" size="station" />
        <VitalCard name="נשימות" abbr="RR" value={32} unit="/min" level="elevated" trend="up" size="compact" />
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
