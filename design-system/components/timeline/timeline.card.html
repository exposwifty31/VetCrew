<!-- @dsCard group="Components" viewport="900x300" name="Timeline scrubber" subtitle="RTL AAR scrubber — shape-coded markers, role lanes, click-to-seek (score→event)" -->
<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;background:var(--bg-canvas);color:var(--text);font-family:var(--font-ui);}
  .wrap{padding:var(--sp-6);}
  .panel{background:var(--surface);border:var(--border-w) solid var(--border);border-radius:var(--radius-lg);padding:var(--sp-5);box-shadow:var(--elev-1);}
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { TimelineScrubber } = window.DesignSystem_ad98cb;
function Demo(){
  const [pos,setPos] = React.useState(228);
  const markers = [
    { t: 20,  type:"phase",     role:"patient",      label:"טריאז'" },
    { t: 74,  type:"action",    role:"primary_tech", label:"גישה ורידית" },
    { t: 132, type:"callout",   role:"vet",          label:"קריאת מדדים" },
    { t: 178, type:"injection", role:"instructor",   label:"בעל הבית נכנס" },
    { t: 228, type:"vitals",    role:"patient",      label:"דופק עולה", severity:"elevated" },
    { t: 300, type:"vitals",    role:"patient",      label:"החמרה", severity:"critical" },
    { t: 360, type:"action",    role:"primary_tech", label:"החייאה" },
  ];
  const lanes = [
    { role:"primary_tech", label:"טכנאי ראשי" },
    { role:"vet",          label:"וטרינר" },
    { role:"patient",      label:"מטופל" },
  ];
  return (
    <div className="panel">
      <TimelineScrubber duration={420} position={pos} markers={markers} lanes={lanes} onSeek={setPos} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
