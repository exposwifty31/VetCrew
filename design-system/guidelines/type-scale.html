<!-- @dsCard group="Type" viewport="700x360" name="Type scale" subtitle="Tablet-first scale — nothing below 13px" -->
<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="spec.css">
<style>.line{display:flex;align-items:baseline;gap:var(--sp-4);border-bottom:var(--border-w) solid var(--hairline);padding-block:var(--sp-2)}
.line .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .k{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--text-faint);width:150px;text-align:end}</style></head>
<body>
<div class="spec">
  <div>
    <div class="line"><span class="t" style="font-size:var(--fs-vital);font-weight:var(--fw-medium);font-family:var(--font-mono)">168</span><span class="k">--fs-vital · 56</span></div>
    <div class="line"><span class="t" style="font-size:var(--fs-display);font-weight:var(--fw-bold)">כותרת ראשית</span><span class="k">--fs-display · 40</span></div>
    <div class="line"><span class="t" style="font-size:var(--fs-h1);font-weight:var(--fw-bold)">כותרת H1</span><span class="k">--fs-h1 · 32</span></div>
    <div class="line"><span class="t" style="font-size:var(--fs-h2);font-weight:var(--fw-semibold)">כותרת H2</span><span class="k">--fs-h2 · 24</span></div>
    <div class="line"><span class="t" style="font-size:var(--fs-h3);font-weight:var(--fw-semibold)">כותרת H3</span><span class="k">--fs-h3 · 20</span></div>
    <div class="line"><span class="t" style="font-size:var(--fs-body-lg)">גוף גדול · body-lg</span><span class="k">--fs-body-lg · 18</span></div>
    <div class="line"><span class="t" style="font-size:var(--fs-body)">גוף רגיל · body</span><span class="k">--fs-body · 16</span></div>
    <div class="line"><span class="t" style="font-size:var(--fs-sm)">משני · small</span><span class="k">--fs-sm · 14</span></div>
    <div class="line"><span class="t" style="font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:var(--ls-caps)">Micro label</span><span class="k">--fs-xs · 13</span></div>
  </div>
</div>
</body>
</html>
